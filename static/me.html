<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, follow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" type="image/png" href="/static/img/favicon.png">
<link rel="apple-touch-icon" href="/static/img/apple-touch.png">
<title>Моя Vita</title>
<script src="/static/theme.js?v=8"></script>
<script src="/static/vita-id.js?v=9"></script>
<script src="/static/gate.js?v=2"></script>
<script src="/static/tg-login.js?v=4"></script>
<link rel="stylesheet" href="/static/style.css?v=115">
</head>
<body>
<header class="head-shrink">
  <div class="head-pill">
    <a class="logo" href="/">⠿ <span class="logo-word">vita</span></a>
    <nav class="nav">
      <a href="/">Обои</a>
      <a href="/me" class="on">Моя Vita</a>
    </nav>
  </div>
</header>

<main>
  <div class="field"><span class="goal-title" style="text-transform:none">Моя Vita</span></div>
  <p class="hint" style="margin-top:-8px">Твой тег, обои и доступ — всё здесь.</p>

  <section class="library-card profile-editor-card">
    <div class="profile-editor-head">
      <label class="avatar-picker" for="profileAvatar" title="Изменить аватар" aria-label="Изменить аватар">
        <span class="profile-avatar profile-avatar-large">
          <img id="profileAvatarImage" alt="" hidden>
          <b id="profileAvatarFallback" aria-hidden="true">V</b>
          <i aria-hidden="true">＋</i>
        </span>
        <input id="profileAvatar" class="avatar-file-input" type="file" accept="image/jpeg,image/png,image/webp" aria-label="Изменить аватар" disabled>
      </label>
      <div class="profile-editor-title">
        <span id="accountState" class="account-state"><i></i>Создаём аккаунт…</span>
        <h2 id="profilePreviewName">Твоя Vita</h2>
        <a id="publicProfileLink" class="profile-handle" href="#" hidden></a>
      </div>
    </div>
    <div class="profile-fields">
      <label class="field">Твой @тег
        <input id="profileHandle" minlength="3" maxlength="24" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="vita_friend">
      </label>
      <p class="hint tag-note" id="handleNote" role="status" aria-live="polite"></p>
    </div>
    <button id="saveProfile" type="button" class="primary" disabled>Сохранить тег</button>
    <p id="profileStatus" class="hint profile-status" role="status" aria-live="polite"></p>
  </section>

  <section class="library-card prime-card" id="accessCard" hidden>
    <span class="prime-word" aria-label="prime">prime</span>
    <p class="access-line" id="accessLine"></p>
    <a class="btn primary prime-open" id="accessBuy" href="/buy" hidden><i class="prime-art" aria-hidden="true"></i><span id="accessBuyText"></span></a>
  </section>

  <section class="library-card">
    <div class="library-head"><h2>Мои обои</h2><a class="btn secondary" href="/">＋ Новые</a></div>
    <div id="wallpapersList" class="wall-list"><p class="page-foot">Загружаю…</p></div>
  </section>

  <section class="library-card" id="postsCard" hidden>
    <div class="library-head"><h2>Мои публикации</h2><a class="btn secondary" href="/feed">Открыть ленту</a></div>
    <div id="postsList"></div>
  </section>

  <button class="ghost-exit" id="logoutBtn" type="button">Выйти</button>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = value => { const node = document.createElement('div'); node.textContent = value ?? ''; return node.innerHTML; };
let profile = null;

const TAG_RE = /^[a-z][a-z0-9_]{1,22}[a-z0-9]$/;
const TAG_RULE = 'Тег: 3–24 знака, латиница, цифры и _, начинать с буквы';
const tagOk = t => TAG_RE.test(t) && !t.includes('__');
const safeCode = value => /^[a-z0-9]{6}$/i.test(String(value || '')) ? String(value) : '';
const safeColor = value => /^#[0-9a-f]{6}$/i.test(String(value || '')) ? String(value) : '#a855f7';
const cleanHandle = value => String(value || '').trim().replace(/^@+/, '');
const safeMediaUrl = value => {
  try {
    const url = new URL(String(value || ''), location.origin);
    return url.origin === location.origin || url.protocol === 'https:' ? url.href : '';
  } catch { return ''; }
};

function renderIdentity(data, { preserveFields = false } = {}) {
  const savedHandle = cleanHandle(data.handle);
  const avatar = safeMediaUrl(data.avatar);
  if (!preserveFields) $('profileHandle').value = savedHandle;
  const handle = preserveFields ? cleanHandle($('profileHandle').value) : savedHandle;
  $('profilePreviewName').textContent = handle ? '@' + handle : 'Твоя Vita';
  $('profileAvatarFallback').textContent = (handle || 'V').trim().charAt(0).toUpperCase() || 'V';
  $('profileAvatarImage').hidden = !avatar;
  if (avatar) $('profileAvatarImage').src = avatar;
  else $('profileAvatarImage').removeAttribute('src');
  const publicLink = $('publicProfileLink');
  publicLink.hidden = !savedHandle;
  publicLink.textContent = savedHandle ? 'твоя страница · /u/' + savedHandle : '';
  publicLink.href = savedHandle ? `/u/${encodeURIComponent(savedHandle)}` : '#';
  $('accountState').innerHTML = '<i></i>Аккаунт готов';
  $('saveProfile').disabled = false;
  $('profileAvatar').disabled = false;
  handleNote();
}

// Сколько замен осталось: тег выбирают один раз и один раз меняют.
function handleNote(extra) {
  const note = $('handleNote');
  if (extra) { note.textContent = extra.text; note.className = 'hint tag-note ' + (extra.cls || ''); return; }
  const left = Number(profile && profile.handleLeft);
  note.className = 'hint tag-note';
  if (profile && profile.handleLocked) note.textContent = 'Тег закреплён за тобой навсегда';
  else if (left === 1) note.textContent = 'Тег выбирается один раз, потом его можно поменять один раз';
  else note.textContent = 'Осталась последняя замена — дальше тег остаётся навсегда';
}

const ICON = {
  edit: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13.4 3.6l3 3M4 16.4l.6-3 8.3-8.3 3 3-8.3 8.3-3.6.4Z"/></svg>',
  share: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13V3m0 0L6.6 6.4M10 3l3.4 3.4M4.5 11.5V16a1 1 0 001 1h9a1 1 0 001-1v-4.5"/></svg>',
  trash: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 5.5h11M8 5.5V4h4v1.5M6 5.5l.7 10.2a1 1 0 001 .8h4.6a1 1 0 001-.8L15 5.5M8.6 8.6v5M11.4 8.6v5"/></svg>',
};

// Ссылка «поделиться» открывает конструктор с уже собранными обоями: человеку
// остаётся нажать «Поставить», будто он сам всё настроил.
const shareUrl = code => `${location.origin}/?w=${encodeURIComponent(code)}`;

function wallItem(item) {
  const code = safeCode(item.code);
  return `<div class="wall-item" data-code="${esc(code)}">
    <i style="background:${safeColor(item.color)}"></i>
    <div class="wall-info"><b>${esc(item.title)}</b><span>${esc(item.mode)} · ${esc(item.shape)} · ${esc(code)}</span></div>
    <a class="btn primary wall-set" href="/s/${encodeURIComponent(code)}">Поставить</a>
    <div class="wall-acts">
      <a class="icon-btn" href="/?w=${encodeURIComponent(code)}" title="Изменить" aria-label="Изменить обои">${ICON.edit}</a>
      <button class="icon-btn" type="button" data-share="${esc(code)}" title="Поделиться" aria-label="Поделиться обоями">${ICON.share}</button>
      <button class="icon-btn danger" type="button" data-del="${esc(code)}" title="Удалить" aria-label="Удалить обои">${ICON.trash}</button>
    </div>
  </div>`;
}

function renderWalls() {
  const walls = Array.isArray(profile && profile.wallpapers) ? profile.wallpapers : [];
  $('wallpapersList').innerHTML = walls.length
    ? walls.map(wallItem).join('')
    : '<p class="hint">Пока нет сохранённых обоев. Сделай первые — это минута.</p>';
}

function render(data) {
  profile = data;
  renderIdentity(data);
  renderWalls();
  const posts = Array.isArray(data.posts) ? data.posts : [];
  $('postsCard').hidden = !posts.length;
  $('postsList').innerHTML = posts.map(post => {
    const postCode = safeCode(post.code), sourceCode = safeCode(post.sourceCode);
    return `<div class="library-item"><div><b>${esc(post.title)}</b><span>${esc(post.kind)} · код ${esc(sourceCode)}</span></div><a href="/feed#post-${encodeURIComponent(postCode)}">Открыть</a></div>`;
  }).join('');
}

// Занятый тег ловим до «Сохранить», а не после отказа сервера.
let tagTimer = 0;
$('profileHandle').addEventListener('input', () => {
  clearTimeout(tagTimer);
  const handle = cleanHandle($('profileHandle').value).toLowerCase();
  if (!handle || handle === cleanHandle(profile && profile.handle).toLowerCase()) { handleNote(); return; }
  if (!tagOk(handle)) { handleNote({ text: TAG_RULE, cls: 'err' }); return; }
  tagTimer = setTimeout(async () => {
    try {
      const res = await fetch('/api/tag-free?tag=' + encodeURIComponent(handle));
      const data = await res.json();
      if (cleanHandle($('profileHandle').value).toLowerCase() !== handle) return;
      if (!data.ok) handleNote({ text: data.why, cls: 'err' });
      else if (!data.free) handleNote({ text: '@' + handle + ' уже занят — придумай другой', cls: 'err' });
      else handleNote({ text: '@' + handle + ' свободен', cls: 'ok' });
    } catch {}
  }, 320);
});

$('saveProfile').addEventListener('click', async () => {
  const button = $('saveProfile');
  const status = $('profileStatus');
  const handle = cleanHandle($('profileHandle').value).toLowerCase();
  if (!tagOk(handle)) {
    status.textContent = TAG_RULE;
    status.classList.add('err');
    return;
  }
  button.disabled = true;
  status.textContent = 'Сохраняем…';
  status.classList.remove('err');
  try {
    const data = await VitaID.updateProfile({ handle });
    profile = { ...profile, ...(data.profile || data) };
    renderIdentity(profile);
    status.textContent = '✓ Тег сохранён';
  } catch (error) {
    status.textContent = error.message;
    status.classList.add('err');
  }
  button.disabled = false;
});

$('profileAvatar').addEventListener('change', async event => {
  const input = event.currentTarget;
  const file = input.files && input.files[0];
  if (!file) return;
  const status = $('profileStatus');
  if (!file.type.startsWith('image/')) {
    status.textContent = 'Выбери картинку';
    status.classList.add('err');
    input.value = '';
    return;
  }
  if (file.size > 8 * 1024 * 1024) {
    status.textContent = 'Фото должно быть не больше 8 МБ';
    status.classList.add('err');
    input.value = '';
    return;
  }
  status.classList.remove('err');
  status.textContent = 'Загружаем фото…';
  try {
    const data = await VitaID.uploadAvatar(file);
    profile = { ...profile, ...(data.profile || data) };
    renderIdentity(profile, { preserveFields: true });
    status.textContent = '✓ Аватар обновлён';
  } catch (error) {
    status.textContent = error.message;
    status.classList.add('err');
  }
  input.value = '';
});

$('profileAvatarImage').addEventListener('error', event => {
  event.currentTarget.hidden = true;
  event.currentTarget.removeAttribute('src');
});

$('wallpapersList').addEventListener('click', async event => {
  const share = event.target.closest('[data-share]');
  const del = event.target.closest('[data-del]');
  if (share) {
    const url = shareUrl(share.dataset.share);
    const title = 'Обои Vita';
    if (navigator.share) { try { await navigator.share({ title, url }); return; } catch { return; } }
    try { await navigator.clipboard.writeText(url); } catch { window.prompt('Скопируй ссылку', url); return; }
    share.classList.add('done');
    setTimeout(() => share.classList.remove('done'), 1400);
    return;
  }
  if (!del) return;
  const code = del.dataset.del;
  if (!confirm('Удалить эти обои? Ссылка на них перестанет работать.')) return;
  del.disabled = true;
  try {
    const res = await fetch('/api/link/' + encodeURIComponent(code) + '?ownerToken=' + encodeURIComponent(VitaID.token() || ''), { method: 'DELETE' });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || 'Не вышло удалить');
    profile.wallpapers = (profile.wallpapers || []).filter(w => w.code !== code);
    renderWalls();
  } catch (error) {
    del.disabled = false;
    $('profileStatus').textContent = error.message;
    $('profileStatus').classList.add('err');
  }
});

$('logoutBtn').addEventListener('click', () => {
  if (!confirm('Выйти из аккаунта? Вернуться сможешь через телеграм или почту.')) return;
  VitaID.logout();
  location.href = '/';
});

async function renderAccess() {
  let state;
  try { state = await VitaID.access(); } catch { return; }
  const line = $('accessLine'), buy = $('accessBuy');
  if (state.paid) {
    line.innerHTML = '<b>Открыт навсегда.</b> Спасибо — Vita твоя, платить больше не нужно.';
  } else if (state.until && !state.expired) {
    const until = new Date(state.until).toLocaleDateString('ru-RU', { day: '2-digit', month: 'long' });
    line.innerHTML = `Пробные дни идут до <b>${esc(until)}</b>. Дальше точки замрут.`;
    if (state.payable) { $('accessBuyText').textContent = `Открыть навсегда — ${state.price} ₽`; buy.hidden = false; }
  } else if (state.expired) {
    line.innerHTML = '<b>Точки замерли.</b> Пробные дни закончились — обои перестали обновляться.';
    if (state.payable) { $('accessBuyText').textContent = `Оживить обои — ${state.price} ₽ навсегда`; buy.hidden = false; }
  } else {
    line.innerHTML = 'Сделай первые обои — 7 дней бесплатно, без карты.';
  }
  $('accessCard').hidden = false;
}

(async () => {
  try { render(await VitaID.ensure()); }
  catch (error) { document.querySelector('main').innerHTML = `<p class="err">${esc(error.message)}</p>`; return; }
  renderAccess();
})();
</script>
</body>
</html>
